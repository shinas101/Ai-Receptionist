version: "3.9"

services:
  # ============================================
  # PostgreSQL with pgvector extension
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_receptionist}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_receptionist"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Clinical API & LiveKit Token Server
  # ============================================
  token_server:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: clinic_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_receptionist}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://localhost,http://localhost,*}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  # ============================================
  # Nginx Reverse Proxy (SSL/HTTPS, Rate Limiting & CORS)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: clinic_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - token_server

  # ============================================
  # LiveKit AI Voice Agent Worker (Production daemon)
  # ============================================
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_agent
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_receptionist}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
