user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # -------------------------------------------------------------
    # 1. Rate Limiting Zones (Leaky-Bucket Algorithm)
    # -------------------------------------------------------------
    # Standard Clinical REST API limit: 10 req/second per client IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Strict LiveKit Token Generation limit: 2 req/second per client IP
    limit_req_zone $binary_remote_addr zone=token_limit:10m rate=2r/s;

    # HTTP 429 Too Many Requests response code
    limit_req_status 429;

    # -------------------------------------------------------------
    # 2. CORS Whitelisting Map
    # Allows localhost (any port), 127.0.0.1, or custom clinic domain
    # -------------------------------------------------------------
    map $http_origin $cors_origin {
        default "";
        "~*^https?://localhost(:[0-9]+)?$" "$http_origin";
        "~*^https?://127\.0\.0\.1(:[0-9]+)?$" "$http_origin";
        "https://clinic.abchealthcare.com" "$http_origin";
    }

    # Upstream Clinical API Container
    upstream clinical_backend {
        server token_server:8080;
        keepalive 32;
    }

    # -------------------------------------------------------------
    # 3. HTTP Server (Port 80) -> Redirect to HTTPS
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name localhost 127.0.0.1 "";

        # Healthcheck endpoint (bypass HTTPS redirect for Docker checks)
        location /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status": "healthy", "service": "nginx-reverse-proxy"}';
        }

        # Automatic redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------
    # 4. HTTPS Server (Port 443) with SSL & Security
    # -------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost 127.0.0.1 "";

        # Self-signed or custom SSL Certificates
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Modern TLS Security & Protocols
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Hardened Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Custom JSON response for rate-limiting
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error": "Too many requests. Please slow down.", "code": "RATE_LIMIT_EXCEEDED"}';
        }

        # ---------------------------------------------------------
        # Strict Rate-Limited LiveKit Token Route
        # ---------------------------------------------------------
        location ~ ^/(api/)?token {
            limit_req zone=token_limit burst=5 nodelay;

            # CORS Headers
            if ($cors_origin != "") {
                add_header "Access-Control-Allow-Origin" "$cors_origin" always;
                add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS" always;
                add_header "Access-Control-Allow-Headers" "Content-Type, Authorization" always;
                add_header "Access-Control-Allow-Credentials" "true" always;
            }

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://clinical_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------
        # General Clinical REST API Routes
        # ---------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            # CORS Headers
            if ($cors_origin != "") {
                add_header "Access-Control-Allow-Origin" "$cors_origin" always;
                add_header "Access-Control-Allow-Methods" "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header "Access-Control-Allow-Headers" "Content-Type, Authorization, X-Admin-Pin" always;
                add_header "Access-Control-Allow-Credentials" "true" always;
            }

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://clinical_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root fallback / health
        location / {
            proxy_pass http://clinical_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
