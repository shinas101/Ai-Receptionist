# ==============================================================================
# Production Kubernetes Deployment for LiveKit AI Voice Agent
# Includes Horizontal Pod Autoscaler (HPA) scaling from 5 to 20 replicas
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-voice-agent
  labels:
    app: clinic-voice-agent
spec:
  # Initial baseline replicas; dynamically managed by HPA between 5 and 20
  replicas: 5
  selector:
    matchLabels:
      app: clinic-voice-agent
  template:
    metadata:
      labels:
        app: clinic-voice-agent
    spec:
      # Crucial for Voice AI: Allow up to 5 minutes for active patient calls to
      # finish gracefully when a pod is scheduled for termination during scale-down.
      terminationGracePeriodSeconds: 300
      containers:
        - name: agent
          image: ghcr.io/shinas101/ai-receptionist-agent:latest
          command: ["uv", "run", "agent.py", "start"]
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: LIVEKIT_URL
              valueFrom:
                secretKeyRef:
                  name: clinic-secrets
                  key: LIVEKIT_URL
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clinic-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: clinic-secrets
                  key: LIVEKIT_API_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clinic-secrets
                  key: OPENAI_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clinic-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

---
# ==============================================================================
# Horizontal Pod Autoscaler (HPA): Dynamically scale from 5 to 20 pods
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinic-voice-agent-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clinic-voice-agent
  minReplicas: 5
  maxReplicas: 20
  metrics:
    # Scale when average CPU exceeds 65% (indicating high audio DSP / transcription load)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    # Scale when memory exceeds 75%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      # React rapidly to incoming call bursts: no stabilization window
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # Prevent flapping and premature call disconnection: 5 minute cooldown
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
      selectPolicy: Min

---
apiVersion: v1
kind: Secret
metadata:
  name: clinic-secrets
type: Opaque
stringData:
  LIVEKIT_URL: "wss://ai-voice-1k1vmmvd.livekit.cloud"
  LIVEKIT_API_KEY: "your_livekit_api_key"
  LIVEKIT_API_SECRET: "your_livekit_api_secret"
  OPENAI_API_KEY: "your_openai_api_key"
  DATABASE_URL: "postgresql://postgres:password@postgres-service:5432/ai_receptionist"
